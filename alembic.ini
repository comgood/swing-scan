# Alembic for the saved rules schema (spec 0014). Plain SQL migrations, no ORM models.
# The URL comes from DATABASE_URL_UNPOOLED at runtime (migrations/env.py): migrations need
# session state that Neon's pooled endpoint cannot keep across checkouts.
[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
