# Checks on every PR and on main. Steps call only `make` targets so agents and CI behave
# the same (spec 0001). `contracts-check` reruns OpenAPI, client and mock generation and
# fails on any diff (spec 0002). Deploy and oracle first ordering arrive with later features.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  # Manual run on any branch, for an image artifact to deploy (infra/README.md step 4).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: make setup
      - run: make lint
      - run: make typecheck
      - run: make test
      - run: make contracts-check
      - run: make data-check
      - run: make build-web

  api-image:
    # The real linux/amd64 Lambda image, built on an x86 runner because Polars segfaults
    # under emulation on Apple Silicon. Build and local smoke only: no push, no AWS, no secrets.
    # On main and on a manual run it also keeps the smoked image as an artifact, which the
    # owner downloads and pushes to ECR by hand until feature 15's OIDC deploy.
    name: api image (build, smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
        id: buildx
      # Exposes the Actions cache URL and token so the `docker build` CLI can use type=gha.
      - uses: crazy-max/ghaction-github-runtime@v4
      - run: make build-api API_BUILD_FLAGS="--load --cache-from type=gha,scope=api-image --cache-to type=gha,mode=max,scope=api-image"
        env:
          # The docker driver cannot export a cache; build on the buildx container builder.
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
      - run: make smoke-image
        timeout-minutes: 5
      - name: Save the image
        if: github.event_name != 'pull_request'
        run: docker save swing-scan-api | gzip > api-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: api-image-${{ github.sha }}
          path: api-image.tar.gz
          retention-days: 7
          compression-level: 0

  guards:
    name: guards (gitleaks, D-6, oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: make guards
      - name: Oracle changes need the oracle-approved label
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'oracle-approved') }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA"...HEAD -- tests/oracle/)
          if [ -n "$changed" ] && [ "$APPROVED" != "true" ]; then
            echo "This PR changes owner only oracle files:"
            echo "$changed"
            echo "The owner must add the oracle-approved label."
            exit 1
          fi
